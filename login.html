
<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | My Website</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #101827, #243b55, #141e30);
      color: white;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 390px;
      padding: 38px 32px;
      border: 1px solid rgba(255,255,255,.16);
      border-radius: 20px;
      background: rgba(255,255,255,.08);
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
    }

    .logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 18px;
      border-radius: 18px;
      background: linear-gradient(135deg, #60a5fa, #818cf8);
      display: grid;
      place-items: center;
      font-size: 30px;
    }

    h1 {
      text-align: center;
      margin: 0 0 8px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #cbd5e1;
      margin-bottom: 30px;
      font-size: 14px;
    }

    label {
      display: block;
      margin: 17px 0 8px;
      font-size: 14px;
      color: #e2e8f0;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: rgba(15,23,42,.8);
      color: white;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #60a5fa;
      box-shadow: 0 0 0 3px rgba(96,165,250,.15);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: linear-gradient(90deg, #3b82f6, #6366f1);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: .2s;
    }

    button:hover {
      filter: brightness(1.12);
      transform: translateY(-1px);
    }

    #message {
      color: #fca5a5;
      text-align: center;
      min-height: 20px;
      margin: 15px 0 0;
      font-size: 14px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #94a3b8;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="login-box">
    <div class="logo">🔐</div>
    <h1>Welcome Back</h1>
    <p class="subtitle">Sign in to continue</p>

    <form id="loginForm">
      <label for="username">Username</label>
      <input
        id="username"
        name="username"
        type="text"
        placeholder="Enter your username"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login →</button>
      <p id="message" role="alert" aria-live="polite"></p>
    </form>

    <div class="footer">MY WEBSITE · SECURE ACCESS DEMO</div>
  </main>

  <script>
    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function (event) {
      event.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      if (username === "Longchodu" && password === "4314931") {
        sessionStorage.setItem("demoLoggedIn", "true");
        window.location.href = "main.html";
      } else {
        message.textContent = "Username หรือ Password ไม่ถูกต้อง";
      }
    });
  </script>
</body>
</html>
